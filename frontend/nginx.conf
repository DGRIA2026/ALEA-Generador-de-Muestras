worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  client_body_temp_path /tmp/alea-nginx/client_temp 1 2;
  proxy_temp_path /tmp/alea-nginx/proxy_temp 1 2;
  fastcgi_temp_path /tmp/alea-nginx/fastcgi_temp 1 2;
  uwsgi_temp_path /tmp/alea-nginx/uwsgi_temp 1 2;
  scgi_temp_path /tmp/alea-nginx/scgi_temp 1 2;

  map $http_x_forwarded_proto $alea_forwarded_proto {
    "" $scheme;
    default $http_x_forwarded_proto;
  }

  map $http_x_forwarded_host $alea_forwarded_host {
    "" $http_host;
    default $http_x_forwarded_host;
  }

  include /tmp/alea-nginx/conf.d/*.conf;
}
